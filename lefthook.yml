# Local safety net — skippable with `git commit/push --no-verify`, or by never running
# `uv run lefthook install`. The real gate is CI on main (.github/workflows/ci.yml), which runs
# the same `make verify` on every push and pull request.
#
# One-time per clone:  uv run lefthook install
#
# pre-commit is fast and scoped to staged files; pre-push runs the whole offline gate (~1-2 min,
# no keys, no network). post-merge / post-checkout only *tell* you when uv.lock moved — they never
# run `uv sync` for you, because on a shared checkout the account that syncs owns the venv.
pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    # A stray markdown file, a dead link in a root doc, or a README badge that disagrees with the
    # Makefile floor never reaches a commit (AGENTS.md: documentation lives in code).
    docs-policy:
      run: uv run pytest tests/test_docs_policy.py -q -p no:cacheprovider

pre-push:
  commands:
    verify:
      run: make verify

post-merge:
  commands:
    lock-drift:
      run: |
        if git diff --name-only ORIG_HEAD HEAD -- uv.lock | grep -q uv.lock; then
          echo ">> uv.lock changed in this merge: run \`make sync\` before running anything."
        fi

post-checkout:
  commands:
    lock-drift:
      # {1} {2} are the previous and new HEAD git passes to the hook ({0} would be all args joined).
      run: |
        if [ "{1}" != "{2}" ] && git diff --name-only {1} {2} -- uv.lock 2>/dev/null | grep -q uv.lock; then
          echo ">> uv.lock differs on this checkout: run \`make sync\` before running anything."
        fi
