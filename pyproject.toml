[project]
name = "openreading"
version = "0.3.0"
description = "One JSON shape from every document parser, so switching, comparing, or routing between parsers never changes your code."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Multiversal Ventures" }]
keywords = [
    "document-processing", "document-parsing", "pdf", "ocr", "pdf-parser", "document-ai",
    "unified-api", "backend-router", "compare-parsers", "json-schema", "compliance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
# Core is Apache-2.0 with ZERO copyleft deps. Adapters live in optional extras below.
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "pyyaml>=6.0",     # MIT — safe_load only, lazy-imported for the optional openreading.yaml (D-v3-1)
    "pypdf>=6.15.0",   # BSD — PDF-layer signal probe (scan/text-source); pymupdf (AGPL) never in core (D-v3-4)
    "cryptography>=50.0",  # Apache-2.0/BSD, AES-256-GCM for ledger blobs (localfs.py, M6).
                           # The ledger is core rather than an extra, so this is a base dep,
                           # not a [server] or [http] one.
]

[project.urls]
Homepage = "https://github.com/multiversal-ventures/openreading-core"
Documentation = "https://github.com/multiversal-ventures/openreading-core/blob/main/src/openreading/README.md"
Repository = "https://github.com/multiversal-ventures/openreading-core"
Issues = "https://github.com/multiversal-ventures/openreading-core/issues"
Changelog = "https://github.com/multiversal-ventures/openreading-core/blob/main/CHANGELOG.md"
Security = "https://github.com/multiversal-ventures/openreading-core/security/policy"

[project.optional-dependencies]
# --- adapter extras, one per backend, then the http, server and all umbrellas ---
pymupdf = ["pymupdf>=1.24"]              # AGPL-3.0 — isolated; imported lazily; license-flagged in descriptor
textract = ["boto3>=1.34"]              # SigV4 signing needs the official SDK (internal/decisions/DECISIONS.md D3)
azure-document-intelligence = ["httpx>=0.27"]
reducto = ["httpx>=0.27", "svix>=1.0"]   # svix = webhook signature verification
chunkr = ["httpx>=0.27"]                 # task API; self-hostable (AGPL) via CHUNKR_BASE_URL
pulse = ["httpx>=0.27"]                  # dev-first extract API; dual inline/is_url response
nuextract = ["httpx>=0.27"]              # NuMind platform: typed-template extraction + NuMarkdown
open-ocr = ["httpx>=0.27"]               # OCR aggregator: ~20 engines behind one API, billed per page
tesseract = ["pytesseract>=0.3.13", "pillow>=10"]  # requires system `tesseract` binary
docling = ["httpx>=0.27"]               # talks to docling-serve over HTTP
qwen-vl = ["httpx>=0.27"]               # OpenAI-compatible endpoint (user-run vLLM/Ollama)
google-document-ai = ["google-cloud-documentai>=2.29"]
google-gemini = ["httpx>=0.27"]           # Gemini Developer API Interactions document processing
anthropic-claude = ["anthropic>=0.39"]
mistral-ocr = ["httpx>=0.27"]             # Mistral Document AI OCR + annotations
http = ["httpx>=0.27"]                   # umbrella for the httpx-based hosted adapters
server = ["fastapi>=0.110", "uvicorn>=0.29"]  # `openreading serve` HTTP API
# Official public benchmark harnesses stay separate from adapter extras. Both publishers require
# Python 3.12 or newer. Exact versions keep their scoring semantics reproducible.
parsebench = [
    "parse-bench==1.0.2; python_version >= '3.12'",
    # ParseBench 1.0.2 imports this SDK while resolving layout metric adapters, even for a local
    # OpenReading target. Without it, layout cases are recorded as worker failures.
    "llama-cloud>=1.4.1; python_version >= '3.12'",
]
# ExtractBench publishes no wheel, so this extra carries a PEP 440 direct reference. PyPI rejects
# an upload whose metadata contains one, so this extra must be dropped or repointed at a released
# `extract-bench` before `openreading` is published. Until then it installs from a clone
# (`pip install -e '.[extractbench]'`) and from a git URL, and not from PyPI.
extractbench = ["extract-bench @ git+https://github.com/run-llama/ExtractBench.git@0880af24f579236bff24291bc7f15e18c2fa51e3 ; python_version >= '3.12'"]
# Every adapter's runtime dependency, and nothing else. `openreading serve` needs the separate
# `server` extra, so the install that covers everything is `.[all,server]`.
# `scripts/check_extras_parity.py` fails if an adapter extra's package is missing from this list.
all = [
    "pymupdf>=1.24", "boto3>=1.34", "httpx>=0.27",
    "pytesseract>=0.3.13", "pillow>=10",
    "google-cloud-documentai>=2.29", "anthropic>=0.39",
    "svix>=1.0",  # reducto's second dep — webhook signature verification, see `reducto` extra
]

[project.scripts]
openreading = "openreading.cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",  # coverage floor enforced in `make verify` (--cov-fail-under)
    "respx>=0.21",
    "httpx>=0.27",
    # Pinned exactly: `ruff format` output changes between minor versions, and a company workspace
    # that resolves this package alongside others must format identically to this repo's own CI.
    # Bump deliberately, in a commit that also reformats.
    "ruff==0.15.22",
    "pyright>=1.1.380",
    "mypy>=1.11",
    # Adapter runtime deps that let the tests execute the local-library adapters. They are
    # dev-only and are not shipped in core. The shipped install path is the per-adapter optional
    # extra. PyMuPDF is AGPL-3.0, so it lives here for testing and in the `pymupdf` extra for
    # users, never in core dependencies.
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",  # tesseract adapter (also needs the system `tesseract` binary)
    "pillow>=10",
    "fastapi>=0.110",  # server: TestClient drives the ASGI app offline
    "svix>=1.0",  # webhook signature verification (reducto) — sign/verify in offline tests
    # Git hooks (lefthook.yml): pre-commit runs ruff plus the docs policy, pre-push runs
    # `make verify`. This is the PyPI wrapper, so there is no separate brew install. Run
    # `uv run lefthook install` once per clone.
    "lefthook>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/openreading"]

[tool.hatch.build.targets.wheel.force-include]
"src/openreading/schemas/request.v0.1.json" = "openreading/schemas/request.v0.1.json"
"src/openreading/schemas/response.v0.1.json" = "openreading/schemas/response.v0.1.json"
"src/openreading/schemas/response.v0.2.json" = "openreading/schemas/response.v0.2.json"
"src/openreading/schemas/adapter-descriptor.v0.1.json" = "openreading/schemas/adapter-descriptor.v0.1.json"
"src/openreading/schemas/adapter-descriptor.v0.2.json" = "openreading/schemas/adapter-descriptor.v0.2.json"
"src/openreading/schemas/strategy-config.v0.1.json" = "openreading/schemas/strategy-config.v0.1.json"
"src/openreading/schemas/comparison-report.v0.1.json" = "openreading/schemas/comparison-report.v0.1.json"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D100", "D104"]
# D100/D104: every module and package carries a docstring — documentation lives in code (AGENTS.md).
ignore = ["E501"]  # long lines tolerated in schema-mirroring literals / docstrings

[tool.pytest.ini_options]
# A caller's own `-q` stacks with this addopts `-q` rather than replacing it. Two `-q`s reach
# pytest verbosity -2, which suppresses pytest's own final summary line (see the
# tests/conftest.py docstring).
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits a real backend/network; skipped unless the backend's env key is set",
]
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false   # adapter extras are optional/lazy-imported

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["openreading"]

[tool.coverage.run]
source = ["src/openreading"]
# Adapter extras are lazy-imported, so this measures what the offline suite actually exercises.
# Ledger T2 (internal/design/ledger.md §7, §12): the ledger's logic is almost entirely
# resume-or-do-not-resume branches, and statement-only coverage cannot see a branch that was
# never taken. Branch mode measures about 95% on a healthy tree, so it does not threaten the
# 91% floor.
branch = true

[tool.coverage.report]
show_missing = true
# The floor is enforced in `make verify` via --cov-fail-under (see Makefile). It guards against
# silent regressions. Raise it as coverage climbs, and never lower it to make a red build pass.
precision = 0
