[project]
name = "openreading"
version = "0.3.0"
description = "One unified API for document processing — one request shape, one response schema over many backends."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenReading" }]
keywords = ["document-processing", "ocr", "pdf", "idp", "router", "unified-api"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Core is Apache-2.0 with ZERO copyleft deps. Adapters live in optional extras below.
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "pyyaml>=6.0",     # MIT — safe_load only, lazy-imported for the optional openreading.yaml (D-v3-1)
    "pypdf>=4.0",      # BSD — PDF-layer signal probe (scan/text-source); pymupdf (AGPL) never in core (D-v3-4)
]

[project.optional-dependencies]
# --- adapter extras (installed per-phase; AGPL deps isolated here, never in core) ---
pymupdf = ["pymupdf>=1.24"]              # AGPL-3.0 — isolated; imported lazily; license-flagged in descriptor
textract = ["boto3>=1.34"]              # SigV4 → official SDK (see DECISIONS D3)
azure-document-intelligence = ["httpx>=0.27"]
reducto = ["httpx>=0.27", "svix>=1.0"]   # svix = webhook signature verification
chunkr = ["httpx>=0.27"]                 # task API; self-hostable (AGPL) via CHUNKR_BASE_URL
pulse = ["httpx>=0.27"]                  # dev-first extract API; dual inline/is_url response
nuextract = ["httpx>=0.27"]              # NuMind platform: typed-template extraction + NuMarkdown
open-ocr = ["httpx>=0.27"]               # OCR aggregator: ~20 engines behind one API, billed per page
tesseract = ["pytesseract>=0.3.13", "pillow>=10"]  # requires system `tesseract` binary
docling = ["httpx>=0.27"]               # talks to docling-serve over HTTP
qwen-vl = ["httpx>=0.27"]               # OpenAI-compatible endpoint (user-run vLLM/Ollama)
google-document-ai = ["google-cloud-documentai>=2.29"]
anthropic-claude = ["anthropic>=0.39"]
http = ["httpx>=0.27"]                   # umbrella for the httpx-based hosted adapters
server = ["fastapi>=0.110", "uvicorn>=0.29"]  # `openreading serve` HTTP API
all = [
    "pymupdf>=1.24", "boto3>=1.34", "httpx>=0.27",
    "pytesseract>=0.3.13", "pillow>=10",
    "google-cloud-documentai>=2.29", "anthropic>=0.39",
    "svix>=1.0",  # reducto's second dep — webhook signature verification, see `reducto` extra
]

[project.scripts]
openreading = "openreading.cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",  # coverage floor enforced in `make verify` (--cov-fail-under)
    "respx>=0.21",
    "httpx>=0.27",
    # Pinned exactly: `ruff format` output changes between minor versions, and a company workspace
    # that resolves this package alongside others must format identically to this repo's own CI.
    # Bump deliberately, in a commit that also reformats.
    "ruff==0.16.4",
    "pyright>=1.1.380",
    "mypy>=1.11",
    # adapter runtime deps needed to EXECUTE local-library adapters in tests. These are dev-only
    # (not shipped in core); the shipped install path is the per-adapter optional extra. PyMuPDF
    # is AGPL — it lives here for testing and in the `pymupdf` extra for users, never in core deps.
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",  # tesseract adapter (also needs the system `tesseract` binary)
    "pillow>=10",
    "fastapi>=0.110",  # server (Phase 8) — TestClient drives the ASGI app offline
    "svix>=1.0",  # webhook signature verification (reducto) — sign/verify in offline tests
    # Git hooks (lefthook.yml): pre-commit ruff + docs policy, pre-push `make verify`. PyPI wrapper,
    # no separate brew install; one-time `uv run lefthook install` per clone.
    "lefthook>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openreading"]

[tool.hatch.build.targets.wheel.force-include]
"src/openreading/schemas/request.v0.1.json" = "openreading/schemas/request.v0.1.json"
"src/openreading/schemas/response.v0.1.json" = "openreading/schemas/response.v0.1.json"
"src/openreading/schemas/response.v0.2.json" = "openreading/schemas/response.v0.2.json"
"src/openreading/schemas/adapter-descriptor.v0.1.json" = "openreading/schemas/adapter-descriptor.v0.1.json"
"src/openreading/schemas/adapter-descriptor.v0.2.json" = "openreading/schemas/adapter-descriptor.v0.2.json"
"src/openreading/schemas/strategy-config.v0.1.json" = "openreading/schemas/strategy-config.v0.1.json"
"src/openreading/schemas/comparison-report.v0.1.json" = "openreading/schemas/comparison-report.v0.1.json"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D100", "D104"]
# D100/D104: every module and package carries a docstring — documentation lives in code (AGENTS.md).
ignore = ["E501"]  # long lines tolerated in schema-mirroring literals / docstrings

[tool.pytest.ini_options]
# A caller's own `-q` stacks with this addopts `-q` rather than no-op'ing — two `-q`s reach pytest verbosity -2, which suppresses pytest's own final summary line (see the tests/conftest.py docstring).
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits a real backend/network; skipped unless the backend's env key is set",
]
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false   # adapter extras are optional/lazy-imported

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["openreading"]

[tool.coverage.run]
source = ["src/openreading"]
# adapter extras are lazy-imported; measure what the offline suite actually exercises
# Ledger T2 (§7, §12): statement-only coverage measures the wrong thing for a durable plane, which
# is nothing but resume/no-resume branches. --cov-branch on a healthy tree already measures ~95%,
# so this is not expected to threaten the 91% floor (internal/design/ledger.md §12) — verified by
# running make verify after the flip, not assumed.
branch = true

[tool.coverage.report]
show_missing = true
# The floor is enforced in `make verify` via --cov-fail-under (see Makefile). It guards against
# silent regressions; raise it as coverage climbs, never lower it to make a red build pass.
precision = 0
