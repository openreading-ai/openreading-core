name: Live

# This workflow calls the real backends, so it runs only when someone dispatches it by hand.
# It never runs on a push or a pull request, which the offline `CI` workflow covers. Each
# live test skips unless its backend's secrets are present (skip_unless_creds), so a run
# with no secrets configured skips everything.
on:
  workflow_dispatch:

# Runs with real provider secrets in its environment; the repo token still needs read only.
permissions:
  contents: read

# Two manual dispatches would hit the same real backends (and the same Textract S3 bucket)
# at once; queue them instead.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    # More generous than the offline jobs since this fans out across every keyed backend serially,
    # but still bounded well short of GitHub's 360-minute default (BL-56) — a hung provider call or
    # stuck poll/retry loop shouldn't sit on a runner indefinitely with real secrets live.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (all extras + dev)
        run: uv sync --locked --all-extras --dev

      - name: make verify-live (keyed; skips backends whose secrets are absent)
        run: make verify-live
        env:
          REDUCTO_API_KEY: ${{ secrets.REDUCTO_API_KEY }}
          CHUNKR_API_KEY: ${{ secrets.CHUNKR_API_KEY }}
          PULSE_API_KEY: ${{ secrets.PULSE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NUEXTRACT_API_KEY: ${{ secrets.NUEXTRACT_API_KEY }}
          OPENOCR_API_KEY: ${{ secrets.OPENOCR_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          OPENREADING_TEXTRACT_S3_BUCKET: ${{ secrets.OPENREADING_TEXTRACT_S3_BUCKET }}
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
          AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROCESSOR_ID: ${{ secrets.GCP_PROCESSOR_ID }}
          # google-document-ai also needs GOOGLE_APPLICATION_CREDENTIALS pointing at a service-account
          # JSON file; write it from a secret in a real deployment (skipped cleanly if unset).
