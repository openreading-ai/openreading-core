name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not belong here. Follow the
        [security policy](https://github.com/openreading-ai/openreading-core/security/policy)
        instead.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the exact output rather than paraphrasing it. Send the JSON OpenReading printed, the entries under its `warnings[]` key, and the exit code.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: The command or Python call, the backend id, the policy/strategy file if any, and a document that shows it (or its shape if you cannot share it).
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "Output of `uv run openreading backends` (it prints readiness and variable names, never key values, so redact nothing), plus `uv run openreading --version`, `python --version`, and your OS."
    validations: { required: true }
