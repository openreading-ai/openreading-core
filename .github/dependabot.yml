version: 2
updates:
  # The ecosystem is `uv`, not `pip`. The pip updater edits only the lower bounds in
  # pyproject.toml and leaves uv.lock alone, and uv.lock is what CI and `make sync` install.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # ruff is pinned exactly in pyproject.toml, because `ruff format` output changes between
      # minor versions. A bump therefore has to land in a commit that also reformats the tree,
      # by hand and deliberately. An automated bump pull request just fails `make verify` on the
      # formatting diff.
      - dependency-name: ruff
    groups:
      # Routine patch and minor bumps arrive as one pull request. Majors still arrive separately,
      # because those are the ones where somebody has to read a changelog. `make verify` in CI is
      # the gate either way.
      minor-and-patch:
        update-types: [minor, patch]

  # Action bumps get the same treatment, so a stale pin cannot pile up unreviewed. CI pins every
  # action by commit SHA, so each of these pull requests moves a SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
