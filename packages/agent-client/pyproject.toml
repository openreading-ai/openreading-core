[project]
name = "openreading"
version = "0.3.0"
description = "Client-only retained documents and MCP contracts for OpenReading agent connectors."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = []
dependencies = ["pydantic>=2.7", "jsonschema>=4.21", "mcp>=1.30,<2", "psutil>=7.2,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = []
bypass-selection = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
