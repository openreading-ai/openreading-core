<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc" data-renderer="authored">
  <title id="title">One document, from request to response</title>
  <desc id="desc">A request resolves its named backend, policy chain, or default PyMuPDF. Ordered dispatch applies caller scope. The adapter submits, polls, and normalizes; derive produces shared channels. The response feeds comparison and strategy gates. A next rung returns to dispatch, while a ledger supports resume and replay.</desc>
  <!-- Edit this vector layout directly. The README retains its logical Mermaid flow. -->
  <style>
    :root{color-scheme:light dark}
    text{font-family:Arial,Helvetica,sans-serif}
    .node,.result{fill:#f2f6f9;stroke:#d4dfe7;stroke-width:1.5}
    .title{fill:#233b50;font-size:25px;font-weight:600}
    .detail{fill:#577083;font-size:20px}
    .label{fill:#577083;font-size:17px}
    .step{fill:#64869d;font-size:14px;font-weight:600;letter-spacing:2px}
    .track{fill:none;stroke:#a1b6c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .arrow{fill:#7896ac}.dashed{stroke-dasharray:6 6}
    .contract{fill:#e9f3f8;stroke:#a4c9db;stroke-width:1.5}
    .contract-title{fill:#173f57;font-size:28px;font-weight:600}
    .contract-detail{fill:#45677d;font-size:19px}
    .accent{fill:#3589b0}.pill{fill:#d9eaf3}
    .code{fill:#31637e;font-family:monospace;font-size:17px}
    .panel{fill:#f8fafb;stroke:#d4dfe7;stroke-width:1.5}
    .warning{fill:#fbf6eb;stroke:#d9c69e;stroke-width:1.5}
    .warning-text{fill:#80632e;font-size:19px}
    .good{fill:#edf6f1;stroke:#b2cdbd;stroke-width:1.5}
    .good-text{fill:#35634b;font-size:25px;font-weight:600}
    @media(prefers-color-scheme:dark){
      .node,.result{fill:#18232e;stroke:#324657}
      .title{fill:#e0eaf2}.detail,.label{fill:#a9bdcc}.step{fill:#7ba5be}
      .track{stroke:#4b6c83}.arrow{fill:#729bb5}
      .contract{fill:#173446;stroke:#35627d}
      .contract-title{fill:#e0f0fa}.contract-detail{fill:#abcbdc}
      .accent{fill:#79c6e8}.pill{fill:#234a61}.code{fill:#a4d4ed}
      .panel{fill:#121c25;stroke:#324657}
      .warning{fill:#2a251d;stroke:#695b3c}.warning-text{fill:#d5bc88}
      .good{fill:#172d26;stroke:#365e4b}.good-text{fill:#a1d4b7}
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z"/></marker></defs>
  <text class="step" x="40" y="38" text-anchor="start">01 / REQUEST</text>
  <text class="step" x="380" y="38" text-anchor="start">02 / SELECTION</text>
  <text class="step" x="720" y="38" text-anchor="start">03 / DISPATCH</text>
  <rect class="node" x="40" y="60" width="240" height="124" rx="16"/><text class="title" x="62" y="100" text-anchor="start">Your request</text><text class="detail" x="62" y="135" text-anchor="start">Document and policy</text>
  <rect class="node" x="380" y="60" width="240" height="124" rx="16"/><text class="title" x="402" y="100" text-anchor="start">Resolve backend</text><text class="detail" x="402" y="135" text-anchor="start">Named, policy chain,</text><text class="detail" x="402" y="161" text-anchor="start">or default PyMuPDF</text>
  <rect class="node" x="720" y="60" width="240" height="124" rx="16"/><text class="title" x="742" y="100" text-anchor="start">Ordered dispatch</text><text class="detail" x="742" y="135" text-anchor="start">Apply server</text><text class="detail" x="742" y="161" text-anchor="start">caller scope</text>
  <path class="track" d="M280 122H368" marker-end="url(#arrow)"/>
  <path class="track" d="M620 122H708" marker-end="url(#arrow)"/>
  <path class="track" d="M840 184V258" marker-end="url(#arrow)"/>
  <text class="step" x="40" y="250" text-anchor="start">06 / RESPONSE</text>
  <text class="step" x="380" y="250" text-anchor="start">05 / SHARED CHANNELS</text>
  <text class="step" x="720" y="250" text-anchor="start">04 / ADAPTER</text>
  <rect class="node" x="720" y="270" width="240" height="124" rx="16"/><text class="title" x="742" y="310" text-anchor="start">Read document</text><text class="detail" x="742" y="345" text-anchor="start">Submit, poll,</text><text class="detail" x="742" y="371" text-anchor="start">normalize</text>
  <rect class="node" x="380" y="270" width="240" height="124" rx="16"/><text class="title" x="402" y="310" text-anchor="start">Derive</text><text class="detail" x="402" y="345" text-anchor="start">Text, tables,</text><text class="detail" x="402" y="371" text-anchor="start">geometry</text>
  <rect class="contract" x="40" y="270" width="240" height="124" rx="16"/><text class="contract-title" x="62" y="310" text-anchor="start">One envelope</text><text class="contract-detail" x="62" y="345" text-anchor="start">response.v0.3</text>
  <path class="track" d="M720 332H632" marker-end="url(#arrow)"/>
  <path class="track" d="M380 332H292" marker-end="url(#arrow)"/>
  <path class="track" d="M160 394V436H500V472" marker-end="url(#arrow)"/>
  <path class="track" d="M160 436V472" marker-end="url(#arrow)"/>
  <rect class="node" x="40" y="484" width="240" height="124" rx="16"/><text class="title" x="62" y="524" text-anchor="start">Compare</text><text class="detail" x="62" y="559" text-anchor="start">Typed verdict</text><text class="detail" x="62" y="585" text-anchor="start">and findings</text>
  <rect class="node" x="380" y="484" width="240" height="124" rx="16"/><text class="title" x="402" y="524" text-anchor="start">Strategy gates</text><text class="detail" x="402" y="559" text-anchor="start">Accept the result</text><text class="detail" x="402" y="585" text-anchor="start">or try the next rung</text>
  <rect class="node" x="720" y="484" width="240" height="124" rx="16"/><text class="title" x="742" y="524" text-anchor="start">Ledger journal</text><text class="detail" x="742" y="559" text-anchor="start">Resume and replay</text>
  <path class="track" d="M620 546H708" marker-end="url(#arrow)"/>
  <path class="track dashed" d="M666 546V224H984V122H972" marker-end="url(#arrow)"/>
  <text class="label" x="676" y="208" text-anchor="start">Next rung</text>
  <text class="label" x="40" y="650" text-anchor="start">The same response contract holds whichever backend reads the document.</text>
</svg>
