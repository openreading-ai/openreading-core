<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc" data-renderer="authored">
  <title id="title">Accept a result, or move to the next rung</title>
  <desc id="desc">Each rung runs a backend. Errors follow on_error: next or fail. A successful result reaches the quality gate. If the gate does not fire, accept and stop. If it fires, retain a best-so-far candidate. Continue with the next rung, or return the best retained result with a warning at the end of the ladder.</desc>
  <!-- Edit this vector layout directly. The README retains its logical Mermaid flow. -->
  <style>
    :root{color-scheme:light dark}
    text{font-family:Arial,Helvetica,sans-serif}
    .node,.result{fill:#f2f6f9;stroke:#d4dfe7;stroke-width:1.5}
    .title{fill:#233b50;font-size:25px;font-weight:600}
    .detail{fill:#577083;font-size:20px}
    .label{fill:#577083;font-size:17px}
    .step{fill:#64869d;font-size:14px;font-weight:600;letter-spacing:2px}
    .track{fill:none;stroke:#a1b6c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .arrow{fill:#7896ac}.dashed{stroke-dasharray:6 6}
    .contract{fill:#e9f3f8;stroke:#a4c9db;stroke-width:1.5}
    .contract-title{fill:#173f57;font-size:28px;font-weight:600}
    .contract-detail{fill:#45677d;font-size:19px}
    .accent{fill:#3589b0}.pill{fill:#d9eaf3}
    .code{fill:#31637e;font-family:monospace;font-size:17px}
    .panel{fill:#f8fafb;stroke:#d4dfe7;stroke-width:1.5}
    .warning{fill:#fbf6eb;stroke:#d9c69e;stroke-width:1.5}
    .warning-text{fill:#80632e;font-size:19px}
    .good{fill:#edf6f1;stroke:#b2cdbd;stroke-width:1.5}
    .good-text{fill:#35634b;font-size:25px;font-weight:600}
    @media(prefers-color-scheme:dark){
      .node,.result{fill:#18232e;stroke:#324657}
      .title{fill:#e0eaf2}.detail,.label{fill:#a9bdcc}.step{fill:#7ba5be}
      .track{stroke:#4b6c83}.arrow{fill:#729bb5}
      .contract{fill:#173446;stroke:#35627d}
      .contract-title{fill:#e0f0fa}.contract-detail{fill:#abcbdc}
      .accent{fill:#79c6e8}.pill{fill:#234a61}.code{fill:#a4d4ed}
      .panel{fill:#121c25;stroke:#324657}
      .warning{fill:#2a251d;stroke:#695b3c}.warning-text{fill:#d5bc88}
      .good{fill:#172d26;stroke:#365e4b}.good-text{fill:#a1d4b7}
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z"/></marker></defs>
  <path class="track dashed" d="M960 520H984V46H165V84" marker-end="url(#arrow)"/>
  <text class="label" x="640" y="34" text-anchor="middle">No: advance to the next rung</text>
  <rect class="node" x="40" y="96" width="250" height="116" rx="16"/><text class="title" x="62" y="136" text-anchor="start">Run rung n</text><text class="detail" x="62" y="171" text-anchor="start">Read the document</text>
  <rect class="node" x="400" y="96" width="250" height="116" rx="16"/><text class="title" x="422" y="136" text-anchor="start">Succeeded?</text><text class="detail" x="422" y="171" text-anchor="start">Inspect the outcome</text>
  <rect class="warning" x="710" y="96" width="250" height="116" rx="16"/><text class="title" x="732" y="136" text-anchor="start">on_error</text><text class="detail" x="732" y="171" text-anchor="start">Continue or fail</text><text class="detail" x="732" y="197" text-anchor="start">as configured</text>
  <path class="track" d="M290 154H388" marker-end="url(#arrow)"/>
  <path class="track" d="M650 154H698" marker-end="url(#arrow)"/>
  <text class="label" x="680" y="137" text-anchor="middle">Error</text>
  <path class="track" d="M525 212V270" marker-end="url(#arrow)"/>
  <text class="label" x="544" y="248" text-anchor="start">Yes</text>
  <rect class="good" x="40" y="282" width="250" height="116" rx="16"/><text class="good-text" x="62" y="322" text-anchor="start">Accept and stop</text><text class="detail" x="62" y="357" text-anchor="start">Return this result</text>
  <rect class="node" x="400" y="282" width="250" height="116" rx="16"/><text class="title" x="422" y="322" text-anchor="start">Gate fires?</text><text class="detail" x="422" y="357" text-anchor="start">Check result quality</text>
  <path class="track" d="M400 340H302" marker-end="url(#arrow)"/>
  <text class="label" x="345" y="323" text-anchor="middle">No</text>
  <path class="track" d="M525 398V450" marker-end="url(#arrow)"/>
  <text class="label" x="544" y="435" text-anchor="start">Yes</text>
  <rect class="node" x="400" y="462" width="250" height="116" rx="16"/><text class="title" x="422" y="502" text-anchor="start">Retain candidate</text><text class="detail" x="422" y="537" text-anchor="start">Keep the best so far</text>
  <rect class="node" x="710" y="462" width="250" height="116" rx="16"/><text class="title" x="732" y="502" text-anchor="start">Last rung?</text><text class="detail" x="732" y="537" text-anchor="start">Check the ladder</text>
  <path class="track" d="M650 520H698" marker-end="url(#arrow)"/>
  <path class="track" d="M835 578V650" marker-end="url(#arrow)"/>
  <text class="label" x="855" y="621" text-anchor="start">Yes</text>
  <rect class="contract" x="710" y="662" width="250" height="116" rx="16"/><text class="contract-title" x="732" y="702" text-anchor="start">Return best</text><text class="contract-detail" x="732" y="737" text-anchor="start">Best retained result</text><text class="contract-detail" x="732" y="763" text-anchor="start">plus a warning</text>
  <text class="label" x="40" y="714" text-anchor="start">Quality checks guide escalation.</text>
  <text class="label" x="40" y="742" text-anchor="start">They do not certify correctness.</text>
</svg>
